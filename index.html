<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TraceLog 실시간 스마트 대시보드</title>
    <style>
        body { background: #edf2f7; }
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-800">

    <header class="w-full bg-white border-b border-slate-200 shadow-sm fixed top-0 left-0 z-50">
        <div class="max-w-6xl mx-auto p-4 md:px-6">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between border-b border-slate-100 pb-3 mb-3 gap-3">
                <h1 class="text-xl font-black text-indigo-600 tracking-tight flex items-center gap-2">
                    🎯 TraceLog <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-bold">Smart Analysis</span>
                </h1>
                
                <div class="flex items-center gap-4 bg-slate-100 p-1 rounded-lg text-xs font-bold self-start md:self-auto">
                    <span class="pl-2 text-slate-500">검색 조건 방식:</span>
                    <label class="flex items-center gap-1 cursor-pointer">
                        <input type="radio" name="searchMode" value="AND" checked onchange="filterTimeline()" class="accent-indigo-600"> 
                        <span class="bg-white px-2 py-1 rounded shadow-sm text-indigo-600">모두 만족 (AND)</span>
                    </label>
                    <label class="flex items-center gap-1 cursor-pointer">
                        <input type="radio" name="searchMode" value="OR" onchange="filterTimeline()" class="accent-indigo-600"> 
                        <span class="bg-white px-2 py-1 rounded shadow-sm text-emerald-600">하나라도 만족 (OR)</span>
                    </label>
                </div>
            </div>

            <div class="space-y-2">
                <div class="text-xs font-extrabold text-slate-500 flex items-center gap-1">🔍 클릭하여 대화 필터링 (다중 선택 가능)</div>
                <div id="searchTagPool" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto pr-2">
                </div>
            </div>

            <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center gap-x-4 gap-y-1.5 text-xs">
                <div class="font-extrabold text-slate-500">👁️ 카드 우측에 표시할 태그 카테고리 설정:</div>
                <div class="flex flex-wrap gap-3 font-semibold text-slate-600">
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked value="model1" onchange="toggleTagDisplay()" class="accent-indigo-600"> 의존도</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked value="model2" onchange="toggleTagDisplay()" class="accent-indigo-600"> 탐구단계</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked value="model3" onchange="toggleTagDisplay()" class="accent-indigo-600"> 대화분야</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked value="model4" onchange="toggleTagDisplay()" class="accent-indigo-600"> 사고단계</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked value="model5" onchange="toggleTagDisplay()" class="accent-indigo-600"> 답변길이</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked value="model6" onchange="toggleTagDisplay()" class="accent-indigo-600"> 질문길이</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked value="model7" onchange="toggleTagDisplay()" class="accent-indigo-600"> 답변형식</label>
                </div>
            </div>
        </div>
    </header>

    <section class="w-full max-w-6xl mx-auto px-4 md:px-6 pt-64 pb-24">
        <div class="w-full max-w-4xl mx-auto">
            <div id="timelineContainer" class="space-y-4 relative">
            </div>
        </div>
    </section>

<script>
    const firebaseDatabaseURL = "https://hackerthon-96e47-default-rtdb.firebaseio.com/logs.json";
    const container = document.getElementById('timelineContainer');
    
    let allLogs = []; // 원본 로그 캐시 리스트
    let selectedSearchTags = new Set(); // 선택된 검색 태그 리스트

    // 태그별 컬러 맵
    const tagColors = {
        "ai 의존형": "bg-red-500 text-white", "ai 협업형": "bg-orange-500 text-white", "ai 참고형": "bg-yellow-500 text-slate-900",
        "아이디어": "bg-purple-600 text-white", "개념, 이론 학습": "bg-blue-600 text-white", "실험 설계": "bg-emerald-600 text-white", "오류 해결": "bg-rose-600 text-white", "데이터 해석": "bg-cyan-600 text-white",
        "컴퓨터 과학 및 AI": "bg-indigo-600 text-white", "자연과학 및 실험": "bg-teal-600 text-white", "인문, 사회 및 에세이": "bg-amber-600 text-white", "일반 대화, 기타": "bg-slate-500 text-white",
        "Cognition": "bg-emerald-500 text-white", "Inference": "bg-cyan-500 text-white", "Judgment": "bg-sky-500 text-white", "Creation": "bg-indigo-500 text-white",
        "1~50자": "bg-slate-300 text-slate-800", "51~200자": "bg-slate-400 text-white", "201~1000자": "bg-slate-500 text-white", "1001자 이상": "bg-slate-700 text-white",
        "일반 텍스트": "bg-zinc-500 text-white", "코드": "bg-violet-600 text-white", "시각화 자료(표, 그래프)": "bg-pink-600 text-white",
        "N/A": "bg-stone-300 text-stone-600"
    };

    const masterTagPool = [
        { cat: "model1", label: "ai 의존형" }, { cat: "model1", label: "ai 협업형" }, { cat: "model1", label: "ai 참고형" },
        { cat: "model2", label: "아이디어" }, { cat: "model2", label: "개념, 이론 학습" }, { cat: "model2", label: "실험 설계" }, { cat: "model2", label: "오류 해결" }, { cat: "model2", label: "데이터 해석" },
        { cat: "model3", label: "컴퓨터 과학 및 AI" }, { cat: "model3", label: "자연과학 및 실험" }, { cat: "model3", label: "인문, 사회 및 에세이" }, { cat: "model3", label: "일반 대화, 기타" },
        { cat: "model4", label: "Cognition" }, { cat: "model4", label: "Inference" }, { cat: "model4", label: "Judgment" }, { cat: "model4", label: "Creation" },
        { cat: "model5", label: "1~50자" }, { cat: "model5", label: "51~200자" }, { cat: "model5", label: "201~1000자" }, { cat: "model5", label: "1001자 이상" },
        { cat: "model7", label: "일반 텍스트" }, { cat: "model7", label: "코드" }, { cat: "model7", label: "시각화 자료(표, 그래프)" },
        { cat: "all", label: "N/A" }
    ];

    function initSearchDashboard() {
        const poolContainer = document.getElementById('searchTagPool');
        poolContainer.innerHTML = '';
        
        masterTagPool.forEach(tag => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `px-2.5 py-1 text-xs font-semibold rounded-md border border-slate-200 bg-white text-slate-700 transition hover:bg-slate-50 cursor-pointer shadow-2xs`;
            btn.innerText = tag.label;
            btn.onclick = () => handleTagClick(btn, tag.label);
            poolContainer.appendChild(btn);
        });
    }

    function handleTagClick(button, tagLabel) {
        if (selectedSearchTags.has(tagLabel)) {
            selectedSearchTags.delete(tagLabel);
            button.className = `px-2.5 py-1 text-xs font-semibold rounded-md border border-slate-200 bg-white text-slate-700 transition hover:bg-slate-50 cursor-pointer shadow-2xs`;
        } else {
            selectedSearchTags.add(tagLabel);
            const colorClass = tagColors[tagLabel] || "bg-indigo-600 text-white";
            button.className = `px-2.5 py-1 text-xs font-bold rounded-md ring-2 ring-offset-1 ring-slate-400 ${colorClass} cursor-pointer shadow-sm`;
        }
        filterTimeline(); // 필터링 시에는 하단 스크롤 이동 없이 화면만 업데이트
    }

    function loadTimelineData() {
        fetch(firebaseDatabaseURL)
            .then(res => res.json())
            .then(data => {
                if (!data) {
                    container.innerHTML = '<p style="text-align:center; color:#9ca3af; padding: 20px;">아직 세이브된 대화가 없습니다.</p>';
                    allLogs = [];
                    return;
                }

                const updatedLogs = [];
                for (const key in data) {
                    if (data.hasOwnProperty(key)) {
                        updatedLogs.push(data[key]);
                    }
                }

                // 오직 실시간 데이터의 개수가 증가했을 때만 새 데이터를 받고 맨 아래로 스크롤
                if (updatedLogs.length !== allLogs.length) {
                    const isFirstLoad = allLogs.length === 0;
                    allLogs = updatedLogs;
                    
                    filterTimeline(); 
                    
                    // 새 로그 수신 시에만 스크롤 하단 이동 (최초 로드 제외)
                    if (!isFirstLoad) {
                        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                    }
                }
            })
            .catch(err => console.error("데이터 로딩 에러:", err));
    }

    function filterTimeline() {
        container.innerHTML = '';
        const searchMode = document.querySelector('input[name="searchMode"]:checked').value;

        const filtered = allLogs.filter(log => {
            if (selectedSearchTags.size === 0) return true;

            // 🛠️ 고정 필드명 매핑 오류 해결: 어떤 키값으로 들어오든 내부에 적힌 텍스트 값을 모두 추출
            const currentCardTags = [];
            Object.keys(log).forEach(key => {
                // 시간, 질문, 답변 본문을 제외한 태그 데이터 수집
                if (key !== 'question' && key !== 'answer' && key !== 'time') {
                    const val = String(log[key]);
                    if (val.includes(",")) {
                        val.split(",").forEach(f => currentCardTags.push(f.trim()));
                    } else {
                        currentCardTags.push(val.trim());
                    }
                }
            });

            const searchArr = Array.from(selectedSearchTags);

            if (searchMode === "AND") {
                return searchArr.every(tag => currentCardTags.includes(tag));
            } else {
                return searchArr.some(tag => currentCardTags.includes(tag));
            }
        });

        if (filtered.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#9ca3af; padding: 40px; font-weight: bold;">조건에 일치하는 세이브 내역이 없습니다.</p>';
            return;
        }

        filtered.forEach(log => {
            const itemDiv = document.createElement('div');
            itemDiv.className = "w-full bg-white p-5 rounded-xl border border-slate-200 shadow-xs flex flex-col md:flex-row gap-5 items-stretch transition hover:shadow-md";

            function makeBadge(value, category) {
                if (!value) return '';
                if (value.includes(",")) {
                    return value.split(",").map(val => {
                        const cleanVal = val.trim();
                        return `<span class="tag-badge px-2 py-1 text-[11px] font-bold rounded-md ${tagColors[cleanVal] || 'bg-slate-400 text-white'} shadow-2xs" data-cat="${category}">${cleanVal}</span>`;
                    }).join('');
                }
                return `<span class="tag-badge px-2 py-1 text-[11px] font-bold rounded-md ${tagColors[value] || 'bg-slate-400 text-white'} shadow-2xs" data-cat="${category}">${value}</span>`;
            }

            // 정해진 표준 명칭 또는 model 번호 둘 다 안정적으로 작동하도록 포용적 처리
            const model1 = log.model1 || log.ai_dependency;
            const model2 = log.model2 || log.research_stage;
            const model3 = log.model3 || log.academic_domain;
            const model4 = log.model4 || log.cognitive_process;
            const model5 = log.model5 || log.answer_length;
            const model6 = log.model6 || log.question_length;
            const model7 = log.model7 || log.answer_formats;

            itemDiv.innerHTML = `
                <div class="flex-1 flex flex-col justify-between">
                    <div>
                        <div class="flex items-start justify-between space-x-4 mb-2">
                            <div class="font-extrabold text-slate-900 text-[15px] text-left leading-relaxed" style="word-break: break-all; flex: 1;">🅠 ${escapeHtml(log.question).trim()}</div>
                            <time class="text-[11px] font-black text-indigo-500 shrink-0 bg-indigo-50 px-2 py-0.5 rounded-sm">${log.time || ''}</time>
                        </div>
                        <div class="text-slate-600 text-sm mt-3 pt-3 border-t border-dashed border-slate-100 text-left leading-relaxed font-medium" style="white-space: pre-wrap; word-break: break-all;">🅐 ${escapeHtml(log.answer).trim()}</div>
                    </div>
                </div>
                
                <div class="w-full md:w-44 border-t md:border-t-0 md:border-l border-slate-100 pt-3 md:pt-0 md:pl-4 flex flex-row md:flex-col flex-wrap gap-1.5 content-start shrink-0">
                    ${makeBadge(model1, 'model1')}
                    ${makeBadge(model2, 'model2')}
                    ${makeBadge(model3, 'model3')}
                    ${makeBadge(model4, 'model4')}
                    ${makeBadge(model5, 'model5')}
                    ${makeBadge(model6, 'model6')}
                    ${makeBadge(model7, 'model7')}
                </div>
            `;

            container.appendChild(itemDiv);
        });

        toggleTagDisplay();
    }

    function toggleTagDisplay() {
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(box => {
            const category = box.value;
            const displayStyle = box.checked ? 'inline-block' : 'none';
            const targetBadges = document.querySelectorAll(`.tag-badge[data-cat="${category}"]`);
            targetBadges.forEach(badge => {
                badge.style.display = displayStyle;
            });
        });
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    initSearchDashboard();
    loadTimelineData();
    setInterval(loadTimelineData, 2000);
</script>
</body>
</html>
