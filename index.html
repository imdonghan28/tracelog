<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TraceLog 실시간 타임라인</title>
</head>
<body class="min-h-screen" style="background: #edf2f7;">
    <section class="relative min-h-screen flex flex-col bg-slate-50">
        <div class="w-full max-w-6xl mx-auto px-4 md:px-6 py-24">
            <div class="flex flex-col justify-center divide-y divide-slate-200 [&>*]:py-16">
                <div class="w-full max-w-3xl mx-auto">
                    <div id="timelineContainer" class="space-y-6 relative">
                        
                    </div>
                </div>
            </div>
        </div>
    </section>

<script>
    // 우리 팀의 파이어베이스 서버 주소
    const firebaseDatabaseURL = "https://hackerthon-96e47-default-rtdb.firebaseio.com/logs.json";
    const container = document.getElementById('timelineContainer');

    // 🚀 가장 안전하고 확실하게 파이어베이스 데이터를 실시간으로 가져오는 엔진
    function loadTimelineData() {
        fetch(firebaseDatabaseURL)
            .then(res => res.json())
            .then(data => {
                if (!data) {
                    container.innerHTML = '<p style="text-align:center; color:#9ca3af; padding: 20px;">아직 세이브된 대화가 없습니다.</p>';
                    return;
                }

                // 화면을 한 번 비우고 정렬 시작
                container.innerHTML = '';

                // 파이어베이스 내부 데이터를 뽑아 화면에 카드 배치
                for (const key in data) {
                    if (data.hasOwnProperty(key)) {
                        const log = data[key];
                        const itemDiv = document.createElement('div');
                        
                        // 1 & 2 & 3. 좌우 반갈 로직 및 체크 아이콘을 제거하고, 카드가 100% 넓이를 가지도록 설정
                        itemDiv.className = "w-full";

                        itemDiv.innerHTML = `
                            <div class="w-full bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                                <div class="flex items-start justify-between space-x-4 mb-2">
                                    <div class="font-bold text-slate-900 text-base text-left" style="word-break: break-all; flex: 1;">
                                        ❓ ${escapeHtml(log.question)}
                                    </div>
                                    <time class="text-xs font-medium text-indigo-500 shrink-0 pt-1">${log.time || ''}</time>
                                </div>
                                <div class="text-slate-600 text-sm mt-3 pt-3 border-t border-dashed border-slate-100 text-left" style="white-space: pre-wrap; word-break: break-all;">
                                    🤖 ${escapeHtml(log.answer)}
                                </div>
                            </div>
                        `;

                        container.appendChild(itemDiv);
                    }
                }
                
                // 💫 스크롤 효과 유지
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            })
            .catch(err => console.error("데이터 로딩 에러:", err));
    }

    // 🛡️ 해킹 방지 및 안전 변환 코드 (유지)
    function escapeHtml(text) {
        if (!text) return '';
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 실행 인터벌: 최초 실행 후 2초마다 파이어베이스 새 전송 실시간 감지
    loadTimelineData();
    setInterval(loadTimelineData, 2000);
</script>
</body>
</html>
